<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>ITDP Project Dashboard</title>
<style>
:root{--bg:#06101b;--panel:#0e1c30;--line:#263b59;--text:#edf5ff;--muted:#93a7c4;--blue:#72adff;--green:#35d7a1;--shadow:0 18px 44px rgba(0,0,0,.35)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:#07101c;color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.top{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(14,28,48,.98),rgba(7,16,28,.98));box-shadow:0 8px 28px rgba(0,0,0,.22)}.brand{display:flex;align-items:center;gap:11px;min-width:0}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#2b73c9,#5f49b7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}.brand b{display:block;font-size:15px}.meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{appearance:none;border:1px solid var(--line);background:#10233b;color:var(--text);border-radius:10px;padding:8px 11px;font-weight:750;cursor:pointer;text-decoration:none}.btn:hover{border-color:#4f78a8}.btn.primary{background:#1d5fae;border-color:#397ac9}.frame{width:100%;height:100%;border:0;background:#07101c}.overlay{position:fixed;inset:0;background:rgba(0,5,12,.56);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.18s;z-index:30}.drawer{position:fixed;top:0;right:0;width:min(440px,92vw);height:100%;background:linear-gradient(180deg,#0f1d31,#091522);border-left:1px solid var(--line);box-shadow:-18px 0 50px rgba(0,0,0,.38);transform:translateX(100%);transition:.22s;z-index:31;display:grid;grid-template-rows:auto 1fr auto}.open .overlay{opacity:1;pointer-events:auto}.open .drawer{transform:translateX(0)}.drawer-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.drawer h2{margin:0;font-size:20px}.drawer .sub{color:var(--muted);font-size:12px;margin-top:3px}.history{overflow:auto;padding:12px 16px}.item{border:1px solid var(--line);background:#10213a;border-radius:13px;padding:13px;margin:9px 0}.item .time{font-weight:850}.item .note{color:var(--muted);font-size:12px;margin:4px 0 9px}.item a{color:#a9d1ff;text-decoration:none;font-weight:750}.item a:hover{text-decoration:underline}.foot{padding:14px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.pill{padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--green);font-size:12px}@media(max-width:720px){.top{align-items:flex-start}.actions .secondary{display:none}.meta{max-width:52vw}}
</style>
</head><body><div id="app" class="shell"><header class="top"><div class="brand"><div class="mark">IT</div><div><b>ITDP 项目看板</b><div class="meta">当前版本生成时间：<span id="currentTime">读取中…</span> · 历史版本永久保留</div></div></div><div class="actions"><span class="pill">Versioned Dashboard</span><a class="btn secondary" href="history/">完整时间轴</a><button id="historyBtn" class="btn primary" type="button">历史版本</button></div></header><iframe class="frame" src="dashboard.html" title="ITDP Current Dashboard"></iframe></div><div id="overlay" class="overlay"></div><aside id="drawer" class="drawer"><div class="drawer-head"><div><h2>历史版本</h2><div class="sub">每次看板更新前保存上一版，可按时间回顾。</div></div><button id="closeBtn" class="btn" type="button">关闭</button></div><div id="historyList" class="history"><div class="item"><div class="note">正在读取历史记录…</div></div></div><div class="foot">历史页面为静态快照，不会被后续项目状态变化覆盖。<br><a href="history/" style="color:#9dc9ff">打开完整时间轴 →</a></div></aside>
<script>
const root=document.documentElement;const open=()=>root.classList.add('open');const close=()=>root.classList.remove('open');document.getElementById('historyBtn').onclick=open;document.getElementById('closeBtn').onclick=close;document.getElementById('overlay').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
fetch('./current.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{document.getElementById('currentTime').textContent=x.display_time||x.generated_at||'—';}).catch(()=>document.getElementById('currentTime').textContent='未知');
fetch('./history/manifest.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{const arr=(data.snapshots||[]).slice().sort((a,b)=>b.generated_at.localeCompare(a.generated_at));const el=document.getElementById('historyList');if(!arr.length){el.innerHTML='<div class="item"><div class="note">暂无历史版本。</div></div>';return;}el.innerHTML=arr.map(x=>`<div class="item"><div class="time">${x.display_time}</div><div class="note">${x.note||'项目看板快照'}</div><a href="${x.path}">打开此版本 →</a></div>`).join('');}).catch(()=>document.getElementById('historyList').innerHTML='<div class="item"><div class="note">历史版本读取失败，请稍后刷新。</div></div>');
</script></body></html>
